<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<link rel="icon" href="data:,">
<title>ESP32-NES · TV Stream</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #000; color: #ddd; font-family: system-ui, "Microsoft YaHei", sans-serif; overflow: hidden; }
  #stage { position: fixed; top: 0; right: 0; bottom: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 10px; }
  #cv { image-rendering: pixelated; background: #000; border: 2px solid #222; border-radius: 6px; }
  #gate { position: fixed; top: 0; right: 0; bottom: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,.92); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 22px; z-index: 10; }
  #gate .t { font-size: 20px; color: #8b97ad; }
  #gate .r { font-size: 34px; color: #e8edf7; }
  #gatebtn { font-size: 26px; padding: 18px 40px; border-radius: 14px; background: #1b212a; color: #e8eaed; border: 1px solid #333c48; font-weight: 600; }
  #perf { position: fixed; left: 8px; top: 6px; z-index: 20; color: #9fe8ff; background: rgba(0,0,0,.55); font: 16px monospace; padding: 5px 8px; border-radius: 4px; pointer-events: none; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="256" height="240"></canvas>
</div>
<div id="perf">-- fps</div>
<div id="gate">
  <div class="t">ESP32-NES TV STREAM</div>
  <div class="r" id="gaterom"></div>
  <button id="gatebtn">▶ 按 OK 开始</button>
</div>
<script>
const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const rom = params.get('rom') || '';
const kiosk = params.get('kiosk') === '1';
const cv = $('cv');
const W = 256, H = 240, N = W * H;
const TILE = 8, TILES_X = 32, TILES_Y = 30;

let gl = null, ctx2d = null, img = null;
let glIndexTex = null, glPalTex = null, glProg = null;
const index = new Uint8Array(N);
let palette = new Uint8Array(64 * 3);
let frameCount = 0, byteCount = 0, audioSamples = 0, lastStats = performance.now();
let started = false, watchdog = null;

let ws = null;
let audioCtx = null, scriptNode = null;
const RING = 131072;
const ring = new Int16Array(RING);
let ringW = 0;
let ringR = 0.0;
let audioRate = 24000;
let audioPrimed = false;
let audioLastOut = 0;
let audioFade = 1;
let audioUnderruns = 0;
let audioOverflows = 0;

/* ---------------- WebGL / Canvas ---------------- */
function shader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function initRenderer() {
  const probe = document.createElement('canvas');
  let testGl = null;
  try { testGl = probe.getContext('webgl'); } catch (e) { testGl = null; }
  if (testGl) {
    try {
      gl = cv.getContext('webgl', { alpha: false, antialias: false, depth: false, stencil: false });
      const vs = 'attribute vec2 a; varying vec2 v; void main(){v=vec2(a.x*0.5+0.5,0.5-a.y*0.5); gl_Position=vec4(a,0.0,1.0);}';
      const fs = 'precision mediump float; varying vec2 v; uniform sampler2D uIdx; uniform sampler2D uPal;'
        + 'void main(){ float i=floor(texture2D(uIdx,v).r*255.0+0.5);'
        + 'gl_FragColor=texture2D(uPal,vec2((i+0.5)/64.0,0.5)); }';
      glProg = gl.createProgram();
      gl.attachShader(glProg, shader(gl.VERTEX_SHADER, vs));
      gl.attachShader(glProg, shader(gl.FRAGMENT_SHADER, fs));
      gl.linkProgram(glProg);
      if (!gl.getProgramParameter(glProg, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(glProg));
      gl.useProgram(glProg);
      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
      const loc = gl.getAttribLocation(glProg, 'a');
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

      glIndexTex = gl.createTexture();
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, glIndexTex);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.LUMINANCE, W, H, 0, gl.LUMINANCE, gl.UNSIGNED_BYTE, index);

      glPalTex = gl.createTexture();
      gl.activeTexture(gl.TEXTURE1);
      gl.bindTexture(gl.TEXTURE_2D, glPalTex);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, 64, 1, 0, gl.RGB, gl.UNSIGNED_BYTE, palette);

      gl.uniform1i(gl.getUniformLocation(glProg, 'uIdx'), 0);
      gl.uniform1i(gl.getUniformLocation(glProg, 'uPal'), 1);
      gl.viewport(0, 0, W, H);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);
    } catch (e) {
      console.warn('WebGL failed, using 2D', e);
      gl = null;
    }
  }
  if (!gl) {
    ctx2d = cv.getContext('2d');
    img = ctx2d.createImageData(W, H);
  }
}
function draw() {
  if (gl) {
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, glIndexTex);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, W, H, gl.LUMINANCE, gl.UNSIGNED_BYTE, index);
    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, glPalTex);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, 64, 1, gl.RGB, gl.UNSIGNED_BYTE, palette);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  } else {
    const d = img.data;
    for (let i = 0, p = 0; i < N; i++, p += 4) {
      const c = index[i] * 3;
      d[p] = palette[c]; d[p + 1] = palette[c + 1]; d[p + 2] = palette[c + 2]; d[p + 3] = 255;
    }
    ctx2d.putImageData(img, 0, 0);
  }
}
function fitCanvas() {
  const reserve = kiosk ? 0 : 20;
  const vw = Math.max(window.innerWidth || 0, document.documentElement.clientWidth || 0);
  const vh = Math.max(window.innerHeight || 0, document.documentElement.clientHeight || 0);
  const maxW = vw - 8, maxH = vh - reserve;
  const s = Math.max(1, Math.floor(Math.min(maxW / W, maxH / H)));
  cv.style.width = (W * s) + 'px';
  cv.style.height = (H * s) + 'px';
}
window.addEventListener('resize', fitCanvas);
window.addEventListener('load', fitCanvas);
if (window.ResizeObserver) {
  new ResizeObserver(fitCanvas).observe(document.documentElement);
}

/* ---------------- Audio ---------------- */
function audioInit() {
  if (audioCtx) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  try {
    audioCtx = new AC({ sampleRate: 24000, latencyHint: 'playback' });
  } catch (e) {
    try {
      audioCtx = new AC({ latencyHint: 'playback' });
    } catch (e2) {
      audioCtx = new AC();
    }
  }
  audioPrimed = false;
  audioLastOut = 0;
  audioFade = 1;
  scriptNode = audioCtx.createScriptProcessor(2048, 0, 2);
  scriptNode.onaudioprocess = e => {
    const l = e.outputBuffer.getChannelData(0), r = e.outputBuffer.getChannelData(1);
    if (!audioPrimed) {
      if (ringW - ringR < 9600) {
        l.fill(0);
        r.fill(0);
        return;
      }
      audioPrimed = true;
    }
    const step = audioRate / audioCtx.sampleRate;
    let pos = ringR;
    let underrun = false;
    for (let i = 0; i < l.length; i++) {
      if (pos + 1 >= ringW) {
        /* Conceal a starved ring with a decaying tail, then fade back in
         * when samples arrive; hard zeros create audible clicks. */
        underrun = true;
        audioFade = 0;
        audioLastOut *= 0.995;
        l[i] = audioLastOut;
        r[i] = audioLastOut;
        continue;
      }
      const a = ring[Math.floor(pos) & (RING - 1)] / 32768;
      const b = ring[(Math.floor(pos) + 1) & (RING - 1)] / 32768;
      const f = pos - Math.floor(pos);
      let v = a + (b - a) * f;
      if (audioFade < 1) {
        audioFade = Math.min(1, audioFade + 0.01);
        v *= audioFade;
      }
      audioLastOut = v;
      l[i] = v;
      r[i] = v;
      pos += step;
    }
    if (underrun) {
      audioUnderruns++;
    }
    ringR = pos;
    if (ringW - pos > RING - 4096) {
      ringR = ringW - 9600;
      audioOverflows++;
    }
  };
  scriptNode.connect(audioCtx.destination);
}
function audioWrite(samples, data, offset) {
  for (let i = 0; i < samples; i++) {
    const p = offset + i * 2;
    let v = data[p] | (data[p + 1] << 8);
    if (v & 0x8000) v -= 0x10000;
    ring[ringW & (RING - 1)] = v;
    ringW++;
  }
  if (ringW - ringR > RING - 4096) {
    /* Should be prevented by the fill controller; recover near the target
     * instead of jumping by several seconds. */
    ringR = ringW - 9600;
    audioOverflows++;
  }
}

/* ---------------- Protocol ---------------- */
function handlePalette(d) {
  for (let i = 0; i < 64; i++) {
    const v = d[1 + i * 2] | (d[2 + i * 2] << 8);
    const r5 = (v >> 11) & 0x1F, g6 = (v >> 5) & 0x3F, b5 = v & 0x1F;
    palette[i * 3] = Math.round(r5 * 255 / 31);
    palette[i * 3 + 1] = Math.round(g6 * 255 / 63);
    palette[i * 3 + 2] = Math.round(b5 * 255 / 31);
  }
}
function handleFull(d) {
  if (d.length < 1 + N) return;
  index.set(d.subarray(1, 1 + N));
  draw();
}
function handleFullChunk(d) {
  if (d.length < 5) return;
  const off = d[1] | (d[2] << 8);
  const n = d[3] | (d[4] << 8);
  if (d.length < 5 + n || off + n > N) return;
  index.set(d.subarray(5, 5 + n), off);
  draw();
}
function handleDelta(d) {
  if (d.length < 3) return;
  const count = d[1] | (d[2] << 8);
  let p = 3;
  for (let n = 0; n < count; n++) {
    if (p + 2 > d.length) break;
    const word = d[p] | (d[p + 1] << 8);
    p += 2;
    const tile = word & 0x3FFF;
    const tx = tile % TILES_X, ty = (tile / TILES_X) | 0;
    const off = ty * TILE * W + tx * TILE;
    if (word & 0x8000) {
      let written = 0;
      while (written < 64) {
        if (p + 1 >= d.length) { draw(); return; }
        const run = d[p++], val = d[p++];
        if (run === 0) { draw(); return; }
        for (let k = 0; k < run && written < 64; k++, written++) {
          index[off + (written >> 3) * W + (written & 7)] = val;
        }
      }
    } else if (word & 0x4000) {
      if (p + 20 > d.length) break;
      const pal = [d[p], d[p + 1], d[p + 2], d[p + 3]];
      p += 4;
      for (let row = 0; row < TILE; row++) {
        for (let col = 0; col < TILE; col++) {
          const bi = row * 2 + (col >> 2);
          const sh = 6 - ((col & 3) << 1);
          index[off + row * W + col] = pal[(d[p + bi] >> sh) & 3];
        }
      }
      p += 16;
    } else {
      if (p + 64 > d.length) break;
      let o = off;
      for (let row = 0; row < TILE; row++) {
        index.set(d.subarray(p, p + TILE), o);
        p += TILE;
        o += W;
      }
    }
  }
  draw();
}
function handleAudio(d) {
  if (d.length < 3) return;
  const samples = d[1] | (d[2] << 8);
  if (d.length < 3 + samples * 2) return;
  audioWrite(samples, d, 3);
  audioSamples += samples;
}

/* ---------------- WebSocket ---------------- */
function connect() {
  if (ws && (ws.readyState === WebSocket.CONNECTING || ws.readyState === WebSocket.OPEN)) {
    ws.close();
  }
  if (watchdog) {
    clearTimeout(watchdog);
    watchdog = null;
  }
  started = false;
  ringW = 0;
  ringR = 0;
  audioPrimed = false;
  audioRate = 24000;
  audioLastOut = 0;
  audioFade = 1;
  audioUnderruns = 0;
  audioOverflows = 0;
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const sock = new WebSocket(proto + '://' + location.host + '/ws/stream');
  ws = sock;
  sock.binaryType = 'arraybuffer';
  sock.onopen = () => { sock.send('start ' + rom); };
  sock.onmessage = e => {
    if (typeof e.data === 'string') {
      $('gaterom').textContent = e.data;
      $('gate').style.display = 'flex';
      return;
    }
    const d = new Uint8Array(e.data);
    if (d.length === 0) return;
    byteCount += d.length;
    if (d[0] === 0x04) {
      handlePalette(d);
      return;
    }
    if (d[0] === 0x06) {
      if (!started) {
        started = true;
        if (watchdog) clearTimeout(watchdog);
      }
      frameCount++;
      handleFullChunk(d);
      return;
    }
    if (d[0] === 0x02 || d[0] === 0x01) {
      if (!started) {
        started = true;
        if (watchdog) clearTimeout(watchdog);
      }
      frameCount++;
      if (d[0] === 0x02) handleFull(d); else handleDelta(d);
    } else if (d[0] === 0x03) {
      handleAudio(d);
    }
  };
  sock.onclose = () => {
    if (ws !== sock) return;
    $('gaterom').textContent = started ? '串流已结束' : '串流连接断开';
    $('gate').style.display = 'flex';
  };
  sock.onerror = () => {};
}

$('gaterom').textContent = rom || '未指定 ROM';
$('gatebtn').addEventListener('click', () => {
  fitCanvas();
  try { audioInit(); } catch (e) { console.warn('audio unavailable', e); }
  $('gate').style.display = 'none';
  connect();
  watchdog = setTimeout(() => {
    if (!started) {
      $('gaterom').textContent = '6 秒未收到画面，请检查设备';
      $('gate').style.display = 'flex';
    }
  }, 6000);
});

window.addEventListener('pagehide', () => { if (ws) ws.close(); });
window.addEventListener('beforeunload', () => { if (ws) ws.close(); });
setInterval(() => {
  const now = performance.now();
  const updates = frameCount * 1000 / Math.max(1, now - lastStats);
  const emuFps = audioSamples > 0 ? audioSamples / 400 : updates;
  const kbs = byteCount / 1024 / Math.max(0.001, (now - lastStats) / 1000);
  if (audioPrimed) {
    /* Proportional buffer-level control: settles at the emulator's actual
     * production rate (58-60 fps) instead of chasing noisy packet counts. */
    const fill = ringW - ringR;
    audioRate = 24000 + (fill - 9600) * 0.6;
    audioRate = Math.max(20000, Math.min(24600, audioRate));
  }
  window.__streamAudio = {
    underruns: audioUnderruns,
    overflows: audioOverflows,
    fill: Math.round(ringW - ringR),
    rate: Math.round(audioRate),
    ctxRate: audioCtx ? audioCtx.sampleRate : 0,
    primed: audioPrimed
  };
  frameCount = 0;
  byteCount = 0;
  audioSamples = 0;
  lastStats = now;
  $('perf').textContent = emuFps.toFixed(0) + ' fps · ' + updates.toFixed(0) + ' up/s · '
    + kbs.toFixed(0) + ' KB/s · '
    + (gl ? 'WebGL' : '2D') + ' · ' + (audioCtx ? audioCtx.state : 'noaudio')
    + ' · ' + (cv.style.width || '?');
}, 1000);

initRenderer();
fitCanvas();
setTimeout(fitCanvas, 100);
</script>
</body>
</html>
